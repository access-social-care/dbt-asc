name: CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-parse:
    name: Validate dbt project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install "dbt-snowflake>=1.7,<2.0"

      - name: dbt deps
        run: dbt deps
        env:
          SNOWFLAKE_USER: ci-dummy
          SNOWFLAKE_KEY_FILE: /dev/null

      - name: Set up CI profiles.yml
        # dbt-snowflake validates PEM format at profile load time (even during compile,
        # which never connects to Snowflake). /dev/null fails with MalformedFraming.
        # Generate a structurally valid but non-functional dummy key for CI.
        run: |
          mkdir -p ~/.dbt
          cp setup/profiles.yml.template ~/.dbt/profiles.yml
          openssl genrsa 2048 2>/dev/null | openssl pkcs8 -topk8 -nocrypt -out /tmp/ci_key.p8 2>/dev/null

      - name: dbt parse
        # Validates: YAML schema, ref()/source() resolution, model configs, test names,
        # and Jinja rendering. dbt parse is genuinely connection-free; dbt compile
        # initialises the Snowflake adapter session even though it never executes SQL.
        run: dbt parse
        env:
          SNOWFLAKE_USER: ci-dummy
          SNOWFLAKE_KEY_FILE: /tmp/ci_key.p8

  r-tests:
    name: Run R loader tests
    # self-hosted, matching case_data/signal_processing/helplines_data CI -
    # ascFuncs is a private, non-CRAN package already installed on that
    # runner; there is no cross-repo GITHUB_TOKEN wired up to install it
    # from access-social-care/ascFuncs on a GitHub-hosted runner instead.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Ensure test dependencies are installed
        # ascFuncs itself is assumed already present on this runner (same
        # assumption sibling repos' CI makes - it's never installed there
        # either). Everything else here is CRAN and safe to install/skip.
        run: |
          Rscript -e '
            pkgs <- c("testthat", "withr", "tidyverse", "logger", "cli",
                      "httr", "jsonlite", "DBI")
            missing <- pkgs[!vapply(
              pkgs, requireNamespace, logical(1), quietly = TRUE
            )]
            if (length(missing) > 0) {
              install.packages(missing, repos = "https://cloud.r-project.org")
            }
          '

      - name: Run testthat suite
        run: |
          Rscript -e '
            testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
          '

  lint-r:
    name: Lint R files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so the base-sha diff below can resolve -
          # a shallow clone (default fetch-depth: 1) won't have the PR's
          # base commit available to diff against.
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Ensure lintr is installed
        run: |
          Rscript -e 'if (!requireNamespace("lintr", quietly = TRUE)) install.packages("lintr", repos = "https://cloud.r-project.org")'

      - name: Determine changed R files
        # Diff-only scope: lint only .R files this PR actually touches, under
        # loaders/, analyses/, tests/ (excludes renv/ — not present yet, but
        # excluded defensively so a future renv init doesn't get swept in).
        # main currently carries 245 pre-existing lint violations across 10 of
        # 14 R files; scoping to the diff grandfathers that debt instead of
        # failing every unrelated PR on merge. Deletions (D) are excluded -
        # nothing to lint in a removed file.
        id: changed
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" -- '*.R' > /tmp/changed_r_files_all.txt
          grep -E '^(loaders|analyses|tests)/' /tmp/changed_r_files_all.txt \
            | grep -v '/renv/' > /tmp/changed_r_files.txt || true
          echo "Changed R files in lint scope:"
          cat /tmp/changed_r_files.txt

      - name: Lint changed R files
        # Uses the repo's own .lintr config. Per-file lintr::lint() + stop() on
        # any violation, matching the ascFuncs CI lint job pattern (PR #77) -
        # same fail-on-any-violation behaviour, now scoped to the diff.
        run: |
          Rscript -e '
            files <- readLines("/tmp/changed_r_files.txt")
            files <- files[nzchar(files)]
            files <- files[file.exists(files)]
            if (length(files) == 0) { message("No changed R files in lint scope — skipping lint."); quit(status = 0) }
            message("Linting ", length(files), " changed file(s)...")
            errs <- do.call(c, lapply(files, lintr::lint))
            if (length(errs) > 0) { print(errs); stop(length(errs), " lint error(s) found") }
            message("Lint clean.")
          '
