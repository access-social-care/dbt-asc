name: 'asc'
version: '1.0.0'
config-version: 2

flags:
  send_anonymous_usage_stats: false

# This setting configures which "profile" dbt uses for this project.
profile: 'asc'

# These configurations specify where dbt should look for different types of files
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  asc:
    # Config defaults for all models
    +materialized: table
      
    staging:
      # Thin selection/rename layer over raw sources
      +materialized: table

      la_product:
        # Combined cross-source staging for LA Data Product
        +materialized: table
        +schema: la_product_staging

      acs_helplines:
        # Cross-source UT1/UT2-aggregated staging (Helplines + AdvicePro + AccessAva)
        # Schema fixed 2026-09-14: "acs_helplines" was a typo for "asc_helplines"
        # (Access Social Care). The live schema (previously
        # PUBLIC_STAGING_ACS_HELPLINES, per dbt's default generate_schema_name
        # rule of "<target default schema>_<this config>") has been manually
        # renamed to PUBLIC_STAGING_ASC_HELPLINES - this config must match or
        # the next `dbt run` recreates the old typo'd schema.
        +materialized: table
        +schema: staging_asc_helplines

      external:
        # Typed/deduped views over the append-only external landing tables in
        # EXTERNAL_DATA.LANDING (written by loaders/load_external_sources_to_snowflake.R).
        # These models do real work - Total-row exclusion, month parsing,
        # suppression handling, latest-vintage-per-period dedupe - so they are
        # staging models, not source passthroughs.
        #
        # +database is required here: without it, dbt silently materializes
        # into the project's default target database (confirmed live,
        # 2026-09-16 - these models landed in ANALYTICS instead of
        # EXTERNAL_DATA, following the same unqualified pattern as
        # acs_helplines above). RAW is its own schema, not reused from
        # LANDING - see loaders/sql/create_external_data_database.sql and
        # signal_processing/README.md "External Data Pipeline" for why the
        # four schemas (LANDING/RAW/NORMALISED/SIGNALS) stay separate.
        # Dev/prod isolation. This was a bare `+database: external_data` with
        # no target branch, so `dbt run --select staging.external` under the
        # DEV target wrote to the PRODUCTION EXTERNAL_DATA database -
        # confirmed 2026-09-22 by comparing `dbt ls --target dev` against
        # `--target prod`, which resolved identically. Every other area of
        # this project isolates dev via a separate database (ANALYTICS_DEV),
        # so this follows that convention rather than inventing one.
        # EXTERNAL_DATA_DEV must exist first - see
        # loaders/sql/create_external_data_database.sql.
        +database: "{{ 'EXTERNAL_DATA' if target.name == 'prod' else 'EXTERNAL_DATA_DEV' }}"
        +materialized: table
        # Resolves to EXTERNAL_DATA.RAW verbatim rather than PUBLIC_RAW, via
        # the allowlist in macros/generate_schema_name.sql. Do not change
        # this value without reading that macro's header comment first.
        +schema: raw

    normalised:
      external:
        # Rates per head of population: RAW counts divided by the frozen
        # published denominators in the cld_published_population seed. A
        # separate schema from RAW because a rate and a count are different
        # kinds of number and should not both be reachable by one careless
        # SELECT *, per the four-stage architecture documented in
        # loaders/sql/create_external_data_database.sql.
        +database: "{{ 'EXTERNAL_DATA' if target.name == 'prod' else 'EXTERNAL_DATA_DEV' }}"
        +materialized: table
        +schema: normalised

    intermediate:
      # Aggregation layer between staging and marts
      +materialized: table

      la_product:
        # Gloucestershire aggregations (int_glos_*), all time windows pre-computed.
        # Same physical schema as staging.la_product — this is an organisational
        # split (staging vs intermediate folders), not a schema/location change.
        +materialized: table
        +schema: la_product_staging

    marts:
      # Business logic and aggregations
      +materialized: table
      
      chatbot:
        # Chatbot-specific marts
        +materialized: table

      la_product:
        # Pre-materialized views for LA Data Product PoC (35 models = 7 views x 5 windows)
        # RBAC: grant SELECT on this schema to ANALYTICS_LA_READER role only
        # All models here MUST be small-number suppressed (la_suppress()), this schema
        # is the RBAC boundary for the DPIA-scoped S3 export role. Unsuppressed/ad-hoc
        # models belong in marts.analytics instead (see mart_la_query_summary relocation,
        # admin#5).
        +materialized: table
        +schema: la_product

      analytics:
        # Unsuppressed / ad-hoc cross-LA analysis marts. Deliberately a separate schema
        # from la_product so RBAC roles scoped to the suppressed la_product schema (e.g.
        # the DPIA-scoped S3 export role) do not also grant access to unsuppressed data.
        +materialized: table
        +schema: analytics

# Quoting behavior
# Use Snowflake defaults (unquoted = UPPERCASE)
# This matches Snowflake's standard behavior and simplifies identifier handling
quoting:
  database: false
  schema: false
  identifier: false

# Seeds
seeds:
  asc:
    cld_published_population:
      # Denominators for EXTERNAL_DATA.NORMALISED. Lives in the same database
      # and schema as the models that join it, so the whole external pipeline
      # is self-contained rather than reaching across into REFERENCE.
      #
      # This is a SEED, not a landing table, deliberately. It is lifted from
      # Tables 4-6 of the CLD quarterly ODS files, whose Population column is
      # byte-identical across the 2025-09, 2025-12 and 2026-03 releases
      # (verified 2026-09-22 - England 46,437,085 in all three). A value that
      # never changes is a constant; re-fetching it every quarter forever
      # would be pointless work and would imply a freshness it does not have.
      # Regenerate it only if DHSC actually revises the denominator.
      +database: "{{ 'EXTERNAL_DATA' if target.name == 'prod' else 'EXTERNAL_DATA_DEV' }}"
      +schema: normalised
      +column_types:
        area_code: varchar(9)
        area_name: varchar(128)
        area_unit: varchar(32)
        dimension: varchar(32)
        dimension_value: varchar(128)
        population_base: varchar(16)
        population: number(38,0)
