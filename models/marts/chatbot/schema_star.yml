version: 2

models:
  - name: persona_bridge
    description: One row per transcript_id x persona value, split from accessava.persona. Port of PERSONA_BRIDGE.
    columns:
      - name: transcript_id
        tests:
          - not_null
          - relationships:
              to: ref('accessava')
              field: transcript_id
      - name: persona
        description: One value from the delimited persona list on accessava, split on ';', trimmed, empty values dropped. A value repeated within one list gives repeated rows.
        tests:
          - not_null
          - relationships:
              to: ref('persona_dim')
              field: persona
  - name: persona_dim
    description: Distinct persona values with a surrogate key (alphabetical, from 1). Port of PERSONA_DIM.
    columns:
      - name: persona_id
        description: Surrogate key, ROW_NUMBER over the values in alphabetical (binary) order, starting at 1.
        tests: [unique, not_null]
      - name: persona
        tests: [unique, not_null]
  - name: supercategory_bridge
    description: One row per transcript_id x supercategories value, split from accessava.supercategories. Port of SUPERCATEGORY_BRIDGE.
