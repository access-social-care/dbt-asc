  - name: accessava
    description: One row per AccessAva conversation (transcript_id) for reporting tenants, with the demographic, topic, feedback and journey features joined on. DuckDB replacement for the table AVA.PUBLIC.ACCESSAVA; tenants containing UAT or APDAS_SQUARESPACE are excluded.
    columns:
      - name: transcript_id
        tests: [unique, not_null]
      - name: created_at
        description: UTC calendar day the conversation started (a date, not a timestamp).
        tests: [not_null]
      - name: tenant_name
        description: Reporting tenant name, with any _prod suffix removed and underscores replaced by spaces.
        tests: [not_null]
      - name: county
        description: Always NULL. Kept so the columns match AVA.PUBLIC.ACCESSAVA.
      - name: persona
        description: Persona codes joined with '; '. Split to one row per value in persona_bridge.
      - name: supercategories
        description: Supercategories joined with '; ', mapped from the topics discussed. categories and csis are aligned with it, position for position.
      - name: topic_entry_point
        description: Topic entry points joined with '; ', for example 'Start; Money'.
      - name: entry_month
        tests: [not_null]
  - name: accessava_locality
    description: Geography of each AccessAva conversation (local authority, ward, constituency, NHS ICB and other area names and codes), taken from the first actions_locality row per transcript_id. Not joined into accessava.
    columns:
      - name: transcript_id
        tests: [unique, not_null]
