version: 2

models:
  - name: persona_bridge
    description: One row per transcript_id x persona value, split from accessava.persona. Port of PERSONA_BRIDGE.
    columns:
      - name: transcript_id
        tests:
          - not_null
          - relationships:
              to: ref('accessava')
              field: transcript_id
      - name: persona
        description: Integrity check of validate_bridge_dim_integrity() as a relationships test.
        tests:
          - not_null
          - relationships:
              to: ref('persona_dim')
              field: persona
  - name: persona_dim
    description: Distinct persona values with a surrogate key (alphabetical, from 1). Port of PERSONA_DIM.
    columns:
      - name: persona_id
        tests: [unique, not_null]
      - name: persona
        tests: [unique, not_null]
