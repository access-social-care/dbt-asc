version: 2

models:
  - name: helplines_advicepro_accessava
    description: |
      Cross-source query counts aggregated to the universal theme taxonomy
      (UT1/UT2) instead of per-source categories.
      Grain: LA_NAME x MONTH_DATE x SOURCE_SYSTEM x UT1 x UT2.
      Reads from stg_la_topic_mentions and collapses to monthly grain — does not
      map raw sources independently, so a taxonomy fix in the staging models
      flows through here automatically.
      See model header for per-source count semantics and the 'Unmapped' vs
      'Unmatched' distinction.
      KNOWN EXTERNAL CONSUMER (2026-09): helplines_data's State of the Nation
      (SOTN) build reads ANALYTICS.PUBLIC_STAGING_ASC_HELPLINES directly via a
      Snowflake grant (ROLE_ETL_WRITE), outside dbt lineage - see model
      header for detail. No longer safe to restructure freely; check with
      the helplines_data pipeline owner first.
      LA_NAME may be NULL for AccessAva rows as of 2026-09-17 (row-level
      filter removed upstream in stg_accessava - see that model's header
      comment). Confirmed safe for the known SOTN consumer: build_sotn_table.R
      filters on LA_CODE, not LA_NAME, and AccessAva/AdvicePro rows never
      carry LA_CODE from this source (they pass its England-only filter via
      the is.na(LA_CODE) branch regardless), and its LA_NAME/LA_CODE
      reference check only evaluates rows where LA_CODE is also non-NA - so a
      NULL LA_NAME here does not trigger new false positives there.
    columns:
      - name: LA_NAME
        description: |
          Standardised CASSR local authority name. NULL for a large and
          growing share of AccessAva rows (expected, not a bug, since NULL
          forms its own GROUP BY key here same as any other value - see
          model description). Deliberately no not_null test.
      - name: MONTH_DATE
        description: First day of month (all sources truncated to month grain)
        tests:
          - not_null
      - name: SOURCE_SYSTEM
        description: Originating system
        tests:
          - not_null
          - accepted_values:
              values: ['Helplines', 'AccessAva', 'AdvicePro']
      - name: UT1
        description: |
          Universal theme level 1. Canonical 9 + Advocacy, COVID-19, Cuts,
          Funding disputes, UNMATCHED/Unmatched (explicitly out of taxonomy)
          and Unmapped (source value missing from its map - drift signal).
        tests:
          - not_null
      - name: UT2
        description: Universal theme level 2 (sparse; NULL where not applicable)
      - name: QUERY_COUNT
        description: Count at this grain (see model header for per-source semantics)
        tests:
          - not_null
