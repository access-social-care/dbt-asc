version: 2

models:
  - name: stg_cld_long_term_support
    description: |
      CLD quarterly long-term support, typed and deduped from the append-only
      landing table. Grain: one row per AREA_CODE x SUPPORT_SETTING x AGE_GROUP
      x PERIOD_START, holding the newest published value for that LA-month.
      AREA_CODE, not LA_CODE - see the LA_CODE column note below.

      STOCK measure - a point-in-time count at each month-end. Correct
      aggregation is the latest snapshot or a mean over calendar months.
      NEVER sum this across months.

      Total rows are excluded, "[p]" is lifted into IS_PROVISIONAL, "[c]" into
      IS_SUPPRESSED (with VALUE left NULL, not zero), and each LA-month is
      resolved to its latest vintage. See the model header for the full
      rationale on each.

      UNVERIFIED as of 2026-09-16 - never compiled or run against a live
      warehouse. See README.md in this folder.
    columns:
      - name: LA_CODE
        description: |
          Published LA code, as-is from source. NOT reliably populated - the
          publisher leaves this blank for at least the 2023 local-government-
          reorganisation unitaries (confirmed live: Westmorland and Furness,
          North Northamptonshire both blank here). Not yet validated against
          a REFERENCE lookup. Use AREA_CODE to join, not this column.
      - name: AREA_CODE
        description: Published area (ONS) code. Populated for every row, including the LAs where LA_CODE is blank - this is the reliable join key.
        tests:
          - not_null
      - name: AREA_NAME
        description: LA name as published. NOT standardised to CASSR names - do not join on this.
      - name: AREA_UNIT
        description: "National / Region / ADASS Region / Local Authority. ADASS regions OVERLAP geographic regions rather than nesting (different LA membership for four regions, per the source Notes sheet), so summing across area_unit counts England three times."
      - name: SUPPORT_SETTING_LEVEL
        description: "all / setting. NULL on stg_cld_assessments, which has no support-setting dimension."
      - name: SUPPORT_SETTING
        description: "All / Community / Nursing care / Residential care / Prison. 'All' is a SUBTOTAL equal to the sum of the others (verified England 30 Jun 2025: 482,110 + 54,880 + 139,000 + 260 = 676,250), not an extra category."
        tests:
          - not_null
      - name: AREA_UNIT_LEVEL
        description: "national / region / adass_region / local_authority. Derived, so a query can pin one geography level. ADASS Region overlaps Region rather than nesting - never aggregate the two together."
      - name: BREAKDOWN_DIMENSION
        description: "Which demographic dimension this row breaks down by: age_group, gender or ethnicity. Part of the grain - the literal 'All' occurs in all three."
        tests:
          - not_null
          - accepted_values:
              values: ['age_group', 'gender', 'ethnicity']
      - name: BREAKDOWN_VALUE
        description: "The value within BREAKDOWN_DIMENSION, e.g. '65 and above', 'Female', 'White: Irish'. Includes the 'All' subtotal row."
        tests:
          - not_null
      - name: BREAKDOWN_LEVEL
        description: "Hierarchy level of BREAKDOWN_VALUE. age_group: all/coarse/fine/unknown. gender: all/category. ethnicity: all/group/subgroup. ALWAYS filter to one level before aggregating - see macros/cld_breakdown_level.sql."
      - name: MEASURE
        description: Constant literal identifying the series.
        tests:
          - accepted_values:
              values: ['long_term_support']
      - name: PERIOD_START
        description: First day of the reporting month, parsed from the published month header.
        tests:
          - not_null
      - name: PERIOD_END
        description: Last day of the reporting month (LAST_DAY of PERIOD_START).
        tests:
          - not_null
      - name: VALUE
        description: |
          Numeric value. NULL where IS_SUPPRESSED is true (a suppressed small
          number is unknown, not zero) and NULL where the published cell was
          blank - IS_SUPPRESSED is what distinguishes the two. Deliberately not
          not_null tested for that reason.
      - name: IS_SUPPRESSED
        description: True where the published cell was the "[c]" disclosure-suppression marker.
        tests:
          - not_null
      - name: IS_PROVISIONAL
        description: True where the published month header carried the "[p]" provisional marker.
        tests:
          - not_null
      - name: METRIC_RAW
        description: The original published month header, retained for traceability and for the Total assertion test.
        tests:
          - not_null
      - name: PUBLICATION_DATE
        description: Release period this row's value came from (e.g. "2026-03") - text, not a DATE. Ranked as text for the vintage dedup above; do not TRY_TO_DATE() it, that silently nulls it out.
      - name: SOURCE_URL
        description: Download URL of the vintage this row's value came from.
      - name: RUN_AT
        description: Extraction run timestamp, tiebreaker when two vintages share a publication date.
    tests:
      # AREA_CODE, not LA_CODE - LA_CODE is blank for some legitimate LAs
      # (confirmed: 2023 reorganisation unitaries), and NULL groups as equal
      # in a uniqueness GROUP BY, so different LAs sharing a blank LA_CODE
      # would falsely collide as duplicates.
      - dbt_utils.unique_combination_of_columns:
          # Grain widened 2026-09-22 when the checker's row_filter was removed
          # and Tables 2-3 were stacked in. AREA_UNIT is in the key because
          # ADASS Region and Region are overlapping geographies that can share
          # an AREA_CODE. BREAKDOWN_DIMENSION is in the key because the
          # literal 'All' occurs in all three dimensions and would otherwise
          # collide.
          combination_of_columns:
            - AREA_CODE
            - AREA_UNIT
            - SUPPORT_SETTING
            - BREAKDOWN_DIMENSION
            - BREAKDOWN_VALUE
            - PERIOD_START

  - name: stg_cld_assessments
    description: |
      CLD quarterly assessments, typed and deduped from the append-only
      landing table. Grain: one row per AREA_CODE x AGE_GROUP x PERIOD_START.
      AREA_CODE, not LA_CODE - see the LA_CODE column note below.

      FLOW measure - people assessed that month who had NOT had long-term
      support in the prior 12 months. A sum over a contiguous 12-month window
      is valid, but ONLY because the Total rows are excluded here; summing
      with them still in double-counts every LA.

      No SUPPORT_SETTING column - this file has one fewer breakdown dimension
      than long-term support. Otherwise identical shape and conventions.

      UNVERIFIED as of 2026-09-16 - never compiled or run against a live
      warehouse. See README.md in this folder.
    columns:
      - name: LA_CODE
        description: |
          Published LA code, as-is from source. NOT reliably populated - see
          the same column on stg_cld_assessments for the confirmed gap
          (2023 local-government-reorganisation unitaries). Use AREA_CODE to
          join, not this column.
      - name: AREA_CODE
        description: Published area (ONS) code. Populated for every row - this is the reliable join key.
        tests:
          - not_null
      - name: AREA_NAME
        description: LA name as published. NOT standardised to CASSR names.
      - name: AREA_UNIT
        description: "National / Region / ADASS Region / Local Authority. ADASS regions OVERLAP geographic regions rather than nesting (different LA membership for four regions, per the source Notes sheet), so summing across area_unit counts England three times."
      - name: AREA_UNIT_LEVEL
        description: "national / region / adass_region / local_authority. Derived, so a query can pin one geography level. ADASS Region overlaps Region rather than nesting - never aggregate the two together."
      - name: BREAKDOWN_DIMENSION
        description: "Which demographic dimension this row breaks down by: age_group, gender or ethnicity. Part of the grain - the literal 'All' occurs in all three."
        tests:
          - not_null
          - accepted_values:
              values: ['age_group', 'gender', 'ethnicity']
      - name: BREAKDOWN_VALUE
        description: "The value within BREAKDOWN_DIMENSION, e.g. '65 and above', 'Female', 'White: Irish'. Includes the 'All' subtotal row."
        tests:
          - not_null
      - name: BREAKDOWN_LEVEL
        description: "Hierarchy level of BREAKDOWN_VALUE. age_group: all/coarse/fine/unknown. gender: all/category. ethnicity: all/group/subgroup. ALWAYS filter to one level before aggregating - see macros/cld_breakdown_level.sql."
      - name: MEASURE
        description: Constant literal identifying the series.
        tests:
          - accepted_values:
              values: ['assessments']
      - name: PERIOD_START
        description: First day of the reporting month.
        tests:
          - not_null
      - name: PERIOD_END
        description: Last day of the reporting month.
        tests:
          - not_null
      - name: VALUE
        description: Numeric value; NULL where suppressed or blank (see IS_SUPPRESSED).
      - name: IS_SUPPRESSED
        description: True where the published cell was "[c]".
        tests:
          - not_null
      - name: IS_PROVISIONAL
        description: True where the month header carried "[p]".
        tests:
          - not_null
      - name: METRIC_RAW
        description: Original published month header.
        tests:
          - not_null
      - name: PUBLICATION_DATE
        description: Release period of the winning vintage for this row (e.g. "2026-03") - text, not a DATE. Do not TRY_TO_DATE() it, that silently nulls it out - see stg_cld_long_term_support.sql for the confirmed incident.
      - name: SOURCE_URL
        description: Download URL of the winning vintage.
      - name: RUN_AT
        description: Extraction run timestamp, tiebreaker within a publication date.
    tests:
      # AREA_CODE, not LA_CODE - see the same note on stg_cld_long_term_support.
      - dbt_utils.unique_combination_of_columns:
          # See the note on stg_cld_long_term_support above. SUPPORT_SETTING
          # is NULL on every row of this model (assessments has no such
          # dimension) but is kept in the key so both models declare the same
          # grain.
          combination_of_columns:
            - AREA_CODE
            - AREA_UNIT
            - SUPPORT_SETTING
            - BREAKDOWN_DIMENSION
            - BREAKDOWN_VALUE
            - PERIOD_START
