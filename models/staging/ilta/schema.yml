version: 2

models:
  - name: stg_ilta_accessava
    description: |
      One row per AccessAva conversation with ILTA-mapped GENDER/AGE/DISABILITY/
      ETHNICITY (or a status: Not recorded / Unmapped / Not collected) plus the
      raw values for data-quality inspection. See model header.
    columns:
      - name: RECORD_ID
        tests:
          - unique
          - not_null
      - name: RECORD_WEIGHT
        description: Always 1 (one conversation)

  - name: stg_ilta_advicepro
    description: |
      One row per AdvicePro report row (HS6T5CH9, about one per case), weighted
      by the count of cases collapsed into the row (each case is one person), with ILTA-mapped GENDER/AGE/DISABILITY/
      ETHNICITY (or a status) plus raw values. No LA or member (report has no
      case reference). See model header.
    columns:
      - name: RECORD_ID
        tests:
          - unique
          - not_null
      - name: RECORD_WEIGHT
        description: Identical cases collapsed into the row (>= 1; each case is one person)
        tests:
          - not_null
