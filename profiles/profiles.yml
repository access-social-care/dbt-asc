# DuckDB / MotherDuck target. Repo-local so ~/.dbt (prod, dev) is untouched.
#
# Always run with BOTH flags:
#   dbt <cmd> --profiles-dir profiles --target duckdb
# (the default target in ~/.dbt is Snowflake prod; --target keeps every command
# explicit even though this file only defines duckdb).
#
# Auth: MOTHERDUCK_TOKEN env var, read by DuckDB itself. No secret in this file.
asc:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      # Connect to `staging` (the default database) and attach `marts` so both are
      # writable in one connection. generate_database_name routes every model;
      # raw, raw_external and reference are auto-attached read-only inputs.
      path: "md:staging"
      attach:
        - path: "md:marts"
          alias: marts
      threads: 4
